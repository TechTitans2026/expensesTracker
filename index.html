<!DOCTYPE html>
<html>
<head>
    <title>Personal Expenses Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Personal Expenses Tracker</h1>

<div class="summary">
    <p>Total Income: ₹<span id="income">0</span></p>
    <p>Total Expenses: ₹<span id="expenses">0</span></p>
    <p>Current Balance: ₹<span id="balance">0</span></p>
</div>

<h2>Add Transaction</h2>

<form id="form">
    <input id="description" placeholder="Description" required>
    <input id="amount" type="number" placeholder="Amount" min="0.01" step="0.01" required>
    <input id="date" type="date" required>

    <select id="type">
        <option value="Income">Income</option>
        <option value="Expense">Expense</option>
    </select>

    <select id="category">
        <option>Food</option>
        <option>Travel</option>
        <option>Shopping</option>
        <option>Salary</option>
        <option>Education</option>
        <option>Other</option>
    </select>

    <button type="submit">Add Transaction</button>
</form>

<h2>Manage Categories</h2>
<input id="newCategory" placeholder="New category">
<button onclick="addCategory()">Add Category</button>
<select id="manageCategory"></select>
<button onclick="deleteCategory()">Delete Category</button>

<h2>Search and Filter</h2>

<input id="search" placeholder="Search description or category">

<select id="filterType">
    <option value="">All Types</option>
    <option>Income</option>
    <option>Expense</option>
</select>

<input id="fromDate" type="date">
<input id="toDate" type="date">

<button onclick="displayTransactions()">Filter</button>
<button onclick="clearFilters()">Clear Filters</button>

<h2>Transactions</h2>

<table>
    <thead>
        <tr>
            <th>Description</th>
            <th>Amount</th>
            <th>Date</th>
            <th>Type</th>
            <th>Category</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody id="transactions"></tbody>
</table>

<h2>Monthly Summary</h2>
<p id="monthly"></p>

<h2>Expense Chart by Category</h2>
<canvas id="chart" width="400" height="250"></canvas>

<script src="script.js"></script>
</body>
</html>
